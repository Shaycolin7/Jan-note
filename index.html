html<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Message For Jan</title>
    <style>
        body {
            background-color: #ffe4e1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
        }
        .heart {
            font-size: 80px;
            color: #ff6b81;
            cursor: pointer;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        .hint {
            color: #555;
            font-size: 16px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="heart" onclick="showMessage()">❤️</div>
    <div class="hint">Click the heart, Jan!</div>
</div>

<script>
    function showMessage() {
        alert('✨ i like you Jan ✨');
    }
</script>

</body>
</html>
